name: dispatch_app
description: "Dispatch — delivery planning and resource management."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  google_fonts: ^8.0.0
  intl: ^0.20.0
  go_router: ^17.0.0
  fl_chart: ^1.2.0
  collection: ^1.18.0
  local_auth: ^3.0.2
  url_launcher: ^6.3.2
  # ADM-01: Google sign-in on web, Android and iOS. The web package is named
  # explicitly because lib/services/google_button_web.dart renders its button.
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.0.0
  google_sign_in_platform_interface: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Google's own mark, used unmodified on the native sign-in button as their
    # branding rules require.
    - assets/google_g.png
